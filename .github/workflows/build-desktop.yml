name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --bundles app,dmg
          - os: windows-latest
            args: --bundles nsis,msi
          - os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 \
            libssl-dev libwebkit2gtk-4.1-dev patchelf libxdo-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - run: npm ci
      - name: Configure public GitHub sign-in settings
        run: cp .env.example .env.local
      - name: Build app bundles
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: gitmint-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
